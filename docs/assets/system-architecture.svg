re approval. No dispatch is sent.</text><text x="48" y="1544" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="400" fill="#52615B">Memory is not durable or shared across instances. Supabase is optional; no login / rate limit in this PR.</text></svg>