ruck litres · shift window</text><text x="72" y="904" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="400" fill="#1F2933">TPA Suwung: simulated depot</text><text x="72" y="936" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="400" fill="#1F2933">Operational status unverified</text><rect x="580" y="760" width="440" height="200" rx="16" fill="white" stroke="#0F766E" stroke-width="2" /><text x="604" y="800" font-family="Inter, Arial, sans-serif" font-size="27" font-weight="600" fill="#0F766E">08  Deterministic heuristic</text><text x="604" y="840" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="400" fill="#1F2933">Urgency-first greedy + 2-opt</text><text x="604" y="872" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="400" fill="#1F2933">Capacity / shift checks per stop</text><text x="604" y="904" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="400" fill="#1F2933">Haversine straight-line distances</text><text x="604" y="936" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="400" fill="#1F2933">Hazardous stops unassigned</text><rect x="1112" y="760" width="440" height="200" rx="16" fill="white" stroke="#0F766E" stroke-width="2" /><text x="1136" y="800" font-family="Inter, Arial, sans-serif" font-size="27" font-weight="600" fill="#0F766E">09  Explanation</text><text x="1136" y="840" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="400" fill="#1F2933">Live: gemini-2.5-flash</text><text x="1136" y="872" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="400" fill="#1F2933">Codes → server-rendered facts</text><text x="1136" y="904" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="400" fill="#1F2933">No key: labelled demo-template</text><text x="1136" y="936" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="400" fill="#1F2933">Not route math; no live fallback</text><rect x="1112" y="1056" width="44